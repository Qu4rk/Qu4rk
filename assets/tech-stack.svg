<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="340">
  <defs>
    <pattern id="grid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#000000" stroke-width="1" opacity="0.07" />
    </pattern>
  </defs>

  <rect width="900" height="340" fill="#f8fafc" />
  <rect width="900" height="340" fill="url(#grid2)" />

  <!-- Section title bar -->
  <rect x="6" y="6" width="888" height="44" fill="#000000" />
  <rect x="0" y="0" width="888" height="44" fill="#facc15" stroke="#000000" stroke-width="4" />
  <circle cx="26" cy="22" r="8" fill="#ff66a3" stroke="#000000" stroke-width="2.5" />
  <circle cx="48" cy="22" r="8" fill="#1ac2ff" stroke="#000000" stroke-width="2.5" />
  <circle cx="70" cy="22" r="8" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
  <text x="96" y="27" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="13" font-weight="700" fill="#000000">TECH_STACK // LANGUAGES &amp; FRAMEWORKS</text>

  <!-- Row 1: TypeScript, Next.js, React, Flutter, Python -->
  <!-- TypeScript - blue -->
  <g transform="translate(30, 70)">
    <rect x="5" y="5" width="155" height="80" fill="#000000" />
    <rect x="0" y="0" width="155" height="80" fill="#1ac2ff" stroke="#000000" stroke-width="4" />
    <text x="77" y="34" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">TypeScript</text>
    <text x="77" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" opacity="0.7">PRIMARY</text>
    <rect x="10" y="68" width="135" height="4" fill="#000000" opacity="0.15" />
    <rect x="10" y="68" width="135" height="4" fill="#000000">
      <animate attributeName="width" values="0;135;135;0" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Next.js - pink -->
  <g transform="translate(200, 70)">
    <rect x="5" y="5" width="155" height="80" fill="#000000" />
    <rect x="0" y="0" width="155" height="80" fill="#ff66a3" stroke="#000000" stroke-width="4" />
    <text x="77" y="34" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">Next.js 14</text>
    <text x="77" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" opacity="0.7">APP ROUTER</text>
    <rect x="10" y="68" width="135" height="4" fill="#000000" opacity="0.15" />
    <rect x="10" y="68" width="135" height="4" fill="#000000">
      <animate attributeName="width" values="0;135;135;0" dur="3.5s" repeatCount="indefinite" begin="0.3s" />
    </rect>
  </g>

  <!-- React - green -->
  <g transform="translate(370, 70)">
    <rect x="5" y="5" width="155" height="80" fill="#000000" />
    <rect x="0" y="0" width="155" height="80" fill="#4ade80" stroke="#000000" stroke-width="4" />
    <text x="77" y="34" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">React</text>
    <text x="77" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" opacity="0.7">UI LIBRARY</text>
    <rect x="10" y="68" width="135" height="4" fill="#000000" opacity="0.15" />
    <rect x="10" y="68" width="135" height="4" fill="#000000">
      <animate attributeName="width" values="0;135;135;0" dur="3.8s" repeatCount="indefinite" begin="0.6s" />
    </rect>
  </g>

  <!-- Flutter - purple -->
  <g transform="translate(540, 70)">
    <rect x="5" y="5" width="155" height="80" fill="#000000" />
    <rect x="0" y="0" width="155" height="80" fill="#c084fc" stroke="#000000" stroke-width="4" />
    <text x="77" y="34" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">Flutter</text>
    <text x="77" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" opacity="0.7">MOBILE / DART</text>
    <rect x="10" y="68" width="135" height="4" fill="#000000" opacity="0.15" />
    <rect x="10" y="68" width="135" height="4" fill="#000000">
      <animate attributeName="width" values="0;135;135;0" dur="4.2s" repeatCount="indefinite" begin="0.9s" />
    </rect>
  </g>

  <!-- Python - gold -->
  <g transform="translate(710, 70)">
    <rect x="5" y="5" width="155" height="80" fill="#000000" />
    <rect x="0" y="0" width="155" height="80" fill="#facc15" stroke="#000000" stroke-width="4" />
    <text x="77" y="34" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">Python</text>
    <text x="77" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" opacity="0.7">SCRIPTING / AI</text>
    <rect x="10" y="68" width="135" height="4" fill="#000000" opacity="0.15" />
    <rect x="10" y="68" width="135" height="4" fill="#000000">
      <animate attributeName="width" values="0;135;135;0" dur="3.6s" repeatCount="indefinite" begin="1.2s" />
    </rect>
  </g>

  <!-- Row 2: Tailwind, GSAP, Deepgram, C#, Kubernetes -->
  <!-- TailwindCSS - blue -->
  <g transform="translate(30, 175)">
    <rect x="5" y="5" width="155" height="80" fill="#000000" />
    <rect x="0" y="0" width="155" height="80" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <text x="77" y="34" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#000000" text-anchor="middle">TailwindCSS</text>
    <text x="77" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" opacity="0.7">STYLING</text>
    <!-- Animated border pulse -->
    <rect x="0" y="0" width="155" height="80" fill="none" stroke="#1ac2ff" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- GSAP - pink -->
  <g transform="translate(200, 175)">
    <rect x="5" y="5" width="155" height="80" fill="#000000" />
    <rect x="0" y="0" width="155" height="80" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <text x="77" y="34" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">GSAP</text>
    <text x="77" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" opacity="0.7">ANIMATION</text>
    <rect x="0" y="0" width="155" height="80" fill="none" stroke="#ff66a3" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0.4s" />
    </rect>
  </g>

  <!-- Deepgram - green -->
  <g transform="translate(370, 175)">
    <rect x="5" y="5" width="155" height="80" fill="#000000" />
    <rect x="0" y="0" width="155" height="80" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <text x="77" y="34" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">Deepgram</text>
    <text x="77" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" opacity="0.7">SPEECH STT</text>
    <!-- Mini equalizer animation -->
    <g transform="translate(62, 66)">
      <rect x="0" y="4" width="4" height="6" fill="#4ade80">
        <animate attributeName="height" values="6;2;8;4;6" dur="1s" repeatCount="indefinite" />
        <animate attributeName="y" values="4;8;2;6;4" dur="1s" repeatCount="indefinite" />
      </rect>
      <rect x="8" y="2" width="4" height="8" fill="#4ade80">
        <animate attributeName="height" values="8;4;2;6;8" dur="0.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="2;6;8;4;2" dur="0.8s" repeatCount="indefinite" />
      </rect>
      <rect x="16" y="3" width="4" height="7" fill="#4ade80">
        <animate attributeName="height" values="7;3;9;5;7" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="3;7;1;5;3" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="24" y="5" width="4" height="5" fill="#4ade80">
        <animate attributeName="height" values="5;8;2;7;5" dur="0.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="5;2;8;3;5" dur="0.9s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- C# - purple -->
  <g transform="translate(540, 175)">
    <rect x="5" y="5" width="155" height="80" fill="#000000" />
    <rect x="0" y="0" width="155" height="80" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <text x="77" y="34" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">C#</text>
    <text x="77" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" opacity="0.7">.NET / BACKEND</text>
    <rect x="0" y="0" width="155" height="80" fill="none" stroke="#c084fc" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0.8s" />
    </rect>
  </g>

  <!-- Kubernetes - gold -->
  <g transform="translate(710, 175)">
    <rect x="5" y="5" width="155" height="80" fill="#000000" />
    <rect x="0" y="0" width="155" height="80" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <text x="77" y="34" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000" text-anchor="middle">Kubernetes</text>
    <text x="77" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" opacity="0.7">LEARNING</text>
    <!-- Spinning gear -->
    <g transform="translate(135, 60)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#facc15" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" />
      </circle>
      <line x1="0" y1="-8" x2="0" y2="-4" stroke="#facc15" stroke-width="2" />
      <line x1="0" y1="4" x2="0" y2="8" stroke="#facc15" stroke-width="2" />
      <line x1="-8" y1="0" x2="-4" y2="0" stroke="#facc15" stroke-width="2" />
      <line x1="4" y1="0" x2="8" y2="0" stroke="#facc15" stroke-width="2" />
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite" additive="sum" />
    </g>
  </g>

  <!-- Animated scan line across all badges -->
  <rect x="0" y="70" width="3" height="185" fill="#000000" opacity="0.1">
    <animate attributeName="x" values="0;890;0" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Bottom legend -->
  <g transform="translate(30, 280)">
    <rect x="4" y="4" width="840" height="40" fill="#000000" />
    <rect x="0" y="0" width="840" height="40" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <text x="20" y="26" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="11" font-weight="700" fill="#000000" opacity="0.7">// 10 TECHNOLOGIES &middot; BUILDING PRODUCTION APPS SINCE 2021</text>
    <circle cx="800" cy="20" r="5" fill="#4ade80" stroke="#000000" stroke-width="2">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
