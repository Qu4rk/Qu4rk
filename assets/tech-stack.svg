<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="tech-title tech-desc">
  <title id="tech-title">Tech Stack</title>
  <desc id="tech-desc">Technologies Qu4rk works with: TypeScript, Next.js, React, Flutter, Python, TailwindCSS, GSAP, Deepgram, C#, and Kubernetes.</desc>

  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <rect width="1200" height="200" rx="12" fill="url(#bg-grad2)" />

  <!-- Section label -->
  <text x="64" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#7d8590" letter-spacing="2">// TECH STACK</text>

  <!-- Badge row 1 -->
  <g transform="translate(64, 68)">
    <!-- TypeScript -->
    <rect x="0" y="0" width="160" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="3" height="44" rx="1.5" fill="#58a6ff" />
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">TypeScript</text>

    <!-- Next.js -->
    <rect x="180" y="0" width="120" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="180" y="0" width="3" height="44" rx="1.5" fill="#58a6ff" />
    <text x="196" y="28" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Next.js</text>

    <!-- React -->
    <rect x="320" y="0" width="100" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="320" y="0" width="3" height="44" rx="1.5" fill="#58a6ff" />
    <text x="336" y="28" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">React</text>

    <!-- Flutter -->
    <rect x="440" y="0" width="120" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="440" y="0" width="3" height="44" rx="1.5" fill="#58a6ff" />
    <text x="456" y="28" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Flutter</text>

    <!-- Python -->
    <rect x="580" y="0" width="120" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="580" y="0" width="3" height="44" rx="1.5" fill="#58a6ff" />
    <text x="596" y="28" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Python</text>
  </g>

  <!-- Badge row 2 -->
  <g transform="translate(64, 124)">
    <!-- TailwindCSS -->
    <rect x="0" y="0" width="160" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="3" height="44" rx="1.5" fill="#7d8590" />
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">TailwindCSS</text>

    <!-- GSAP -->
    <rect x="180" y="0" width="100" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="180" y="0" width="3" height="44" rx="1.5" fill="#7d8590" />
    <text x="196" y="28" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">GSAP</text>

    <!-- Deepgram -->
    <rect x="300" y="0" width="140" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="300" y="0" width="3" height="44" rx="1.5" fill="#7d8590" />
    <text x="316" y="28" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Deepgram</text>

    <!-- C# -->
    <rect x="460" y="0" width="80" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="460" y="0" width="3" height="44" rx="1.5" fill="#7d8590" />
    <text x="476" y="28" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">C#</text>

    <!-- Kubernetes -->
    <rect x="560" y="0" width="160" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="560" y="0" width="3" height="44" rx="1.5" fill="#7d8590" />
    <text x="576" y="28" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Kubernetes</text>
  </g>

  <!-- Right side: experience note -->
  <g transform="translate(900, 90)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="13" fill="#7d8590" opacity="0.6">// 10 TECHNOLOGIES</text>
    <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="13" fill="#7d8590" opacity="0.6">// BUILDING SINCE 2021</text>
  </g>
