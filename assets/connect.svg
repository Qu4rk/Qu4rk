<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="conn-title conn-desc">
  <title id="conn-title">Connect</title>
  <desc id="conn-desc">Contact links for Qu4rk: email, Lumina Living, Chronotomi Wealth, and GitHub profile.</desc>

  <defs>
    <linearGradient id="bg-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="12" fill="url(#bg-grad4)" />

  <!-- Section label -->
  <text x="64" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#7d8590" letter-spacing="2">// CONNECT</text>

  <!-- Badges row -->
  <g transform="translate(64, 68)">
    <!-- Email -->
    <rect x="0" y="0" width="280" height="48" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="3" height="48" rx="1.5" fill="#58a6ff" />
    <text x="16" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#e6edf3">liasides.elias@gmail.com</text>

    <!-- GitHub -->
    <rect x="300" y="0" width="200" height="48" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="300" y="0" width="3" height="48" rx="1.5" fill="#58a6ff" />
    <text x="316" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#e6edf3">github.com/Qu4rk</text>

    <!-- Lumina Living -->
    <rect x="520" y="0" width="300" height="48" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="520" y="0" width="3" height="48" rx="1.5" fill="#3fb950" />
    <text x="536" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#e6edf3">lumina-living-six.vercel.app</text>

    <!-- Chronotomi -->
    <rect x="840" y="0" width="290" height="48" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="840" y="0" width="3" height="48" rx="1.5" fill="#3fb950" />
    <text x="856" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#e6edf3">chronotomi-wealth.vercel.app</text>
