<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <pattern id="grid4" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#000000" stroke-width="1" opacity="0.07" />
    </pattern>
  </defs>

  <rect width="900" height="200" fill="#f8fafc" />
  <rect width="900" height="200" fill="url(#grid4)" />

  <!-- Section title bar -->
  <rect x="6" y="6" width="888" height="44" fill="#000000" />
  <rect x="0" y="0" width="888" height="44" fill="#4ade80" stroke="#000000" stroke-width="4" />
  <circle cx="26" cy="22" r="8" fill="#ff66a3" stroke="#000000" stroke-width="2.5" />
  <circle cx="48" cy="22" r="8" fill="#1ac2ff" stroke="#000000" stroke-width="2.5" />
  <circle cx="70" cy="22" r="8" fill="#facc15" stroke="#000000" stroke-width="2.5" />
  <text x="96" y="27" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="13" font-weight="700" fill="#000000">CONNECT // LET'S BUILD SOMETHING</text>

  <!-- Email card -->
  <g transform="translate(30, 70)">
    <rect x="5" y="5" width="400" height="80" fill="#000000" />
    <rect x="0" y="0" width="400" height="80" fill="#1ac2ff" stroke="#000000" stroke-width="4" />

    <!-- Animated mail icon -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="32" height="22" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      <path d="M 0 0 L 16 13 L 32 0" fill="none" stroke="#000000" stroke-width="2.5" />
      <rect x="0" y="0" width="32" height="22" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite" />
      </rect>
    </g>

    <text x="68" y="32" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#000000">EMAIL</text>
    <text x="68" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="12" font-weight="700" fill="#000000">liasides.elias@gmail.com</text>
  </g>

  <!-- Website 1: LuminaLiving -->
  <g transform="translate(450, 70)">
    <rect x="5" y="5" width="410" height="80" fill="#000000" />
    <rect x="0" y="0" width="410" height="80" fill="#ff66a3" stroke="#000000" stroke-width="4" />

    <!-- Animated globe icon -->
    <g transform="translate(24, 24)">
      <circle cx="16" cy="11" r="11" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      <ellipse cx="16" cy="11" rx="5" ry="11" fill="none" stroke="#000000" stroke-width="1.5" />
      <line x1="5" y1="11" x2="27" y2="11" stroke="#000000" stroke-width="1.5" />
      <line x1="16" y1="0" x2="16" y2="22" stroke="#000000" stroke-width="1.5" />
      <circle cx="16" cy="11" r="11" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.5">
        <animate attributeName="r" values="11;14;11" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <text x="68" y="32" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#000000">LUMINA LIVING</text>
    <text x="68" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="11" font-weight="700" fill="#000000">lumina-living-six.vercel.app</text>

    <!-- Live dot -->
    <circle cx="385" cy="16" r="5" fill="#4ade80" stroke="#000000" stroke-width="2">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Website 2: Chronotomi Wealth -->
  <g transform="translate(30, 110)">
    <rect x="5" y="5" width="410" height="80" fill="#000000" />
    <rect x="0" y="0" width="410" height="80" fill="#4ade80" stroke="#000000" stroke-width="4" />

    <g transform="translate(24, 24)">
      <circle cx="16" cy="11" r="11" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      <ellipse cx="16" cy="11" rx="5" ry="11" fill="none" stroke="#000000" stroke-width="1.5" />
      <line x1="5" y1="11" x2="27" y2="11" stroke="#000000" stroke-width="1.5" />
      <line x1="16" y1="0" x2="16" y2="22" stroke="#000000" stroke-width="1.5" />
      <circle cx="16" cy="11" r="11" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.5">
        <animate attributeName="r" values="11;14;11" dur="2.5s" repeatCount="indefinite" begin="0.8s" />
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite" begin="0.8s" />
      </circle>
    </g>

    <text x="68" y="32" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#000000">CHRONOTOMI WEALTH</text>
    <text x="68" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="11" font-weight="700" fill="#000000">chronotomi-wealth.vercel.app</text>

    <circle cx="385" cy="16" r="5" fill="#ffffff" stroke="#000000" stroke-width="2">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0.5s" />
    </circle>
  </g>

  <!-- Website 3: GitHub Profile -->
  <g transform="translate(450, 110)">
    <rect x="5" y="5" width="410" height="80" fill="#000000" />
    <rect x="0" y="0" width="410" height="80" fill="#facc15" stroke="#000000" stroke-width="4" />

    <!-- Animated GitHub-style icon -->
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="14" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      <path d="M 16 6 C 10 6 6 10 6 16 C 6 21 9 25 13 26 C 13 26 13 24 13 24 C 10 25 10 22 10 22 C 10 20 8 20 8 20 C 8 20 10 20 10 20 C 12 20 12 22 12 22 C 14 24 16 23 16 23 C 16 23 16 21 16 21 C 12 20 10 19 10 15 C 10 14 11 13 11 13 C 11 13 10 12 10 10 C 10 10 12 10 13 11 C 15 10 17 10 19 11 C 20 10 22 10 22 10 C 22 12 21 13 21 13 C 21 13 22 14 22 15 C 22 19 20 20 16 21 C 16 21 16 23 16 23 C 18 23 20 24 20 24 C 20 24 20 26 20 26 C 24 25 26 21 26 16 C 26 10 22 6 16 6 Z" fill="#000000" />
    </g>

    <text x="68" y="32" font-family="'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#000000">GITHUB</text>
    <text x="68" y="54" font-family="'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace" font-size="11" font-weight="700" fill="#000000">github.com/Qu4rk</text>

    <circle cx="385" cy="16" r="5" fill="#000000" stroke="#000000" stroke-width="2">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="1s" />
    </circle>
  </g>
</svg>
