<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Qu4rk — Full-Stack Developer &amp; AI Engineer</title>
  <desc id="hero-desc">Developer identity card for Qu4rk, based in Limassol, Cyprus, specializing in AI, speech recognition, and full-stack web development.</desc>

  <defs>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="15%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1" />
      <stop offset="85%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="12" fill="url(#bg-grad)" />

  <!-- Category label -->
  <text x="64" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="16" fill="#7d8590" letter-spacing="2">// DEVELOPER PROFILE</text>

  <!-- Name -->
  <text x="60" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="700" fill="#e6edf3" letter-spacing="-2">Qu4rk</text>

  <!-- Role with cursor -->
  <text x="64" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#58a6ff" font-weight="500">Full-Stack Developer &amp; AI Engineer</text>
  <rect x="478" y="156" width="2" height="20" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" dur="1.2s" repeatCount="indefinite" />
  </rect>

  <!-- Bio line -->
  <text x="64" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#7d8590">Building AI-powered products — speech recognition, luxury web, mobile apps.</text>

  <!-- Metadata row -->
  <g transform="translate(64, 248)">
    <!-- Location -->
    <circle cx="6" cy="6" r="4" fill="#3fb950" />
    <text x="20" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#7d8590">Limassol, Cyprus</text>

    <!-- Separator -->
    <text x="200" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#30363d">|</text>

    <!-- Availability -->
    <circle cx="222" cy="6" r="4" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="236" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#7d8590">Available for collaboration</text>

    <!-- Separator -->
    <text x="470" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#30363d">|</text>

    <!-- Repos -->
    <text x="492" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#7d8590">7 public repos</text>

    <!-- Separator -->
    <text x="610" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#30363d">|</text>

    <!-- Contributions -->
    <text x="632" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" fill="#7d8590">15 contributions / year</text>
  </g>

  <!-- Accent line at bottom -->
  <rect x="0" y="332" width="1200" height="2" fill="url(#accent-line)" />

  <!-- Subtle grid pattern top-right -->
  <g transform="translate(960, 50)" opacity="0.04">
    <rect x="0" y="0" width="3" height="3" fill="#58a6ff" />
    <rect x="20" y="0" width="3" height="3" fill="#58a6ff" />
    <rect x="40" y="0" width="3" height="3" fill="#58a6ff" />
    <rect x="60" y="0" width="3" height="3" fill="#58a6ff" />
    <rect x="80" y="0" width="3" height="3" fill="#58a6ff" />
    <rect x="100" y="0" width="3" height="3" fill="#58a6ff" />
    <rect x="120" y="0" width="3" height="3" fill="#58a6ff" />
    <rect x="140" y="0" width="3" height="3" fill="#58a6ff" />
    <rect x="0" y="20" width="3" height="3" fill="#58a6ff" />
    <rect x="20" y="20" width="3" height="3" fill="#58a6ff" />
    <rect x="40" y="20" width="3" height="3" fill="#58a6ff" />
    <rect x="60" y="20" width="3" height="3" fill="#58a6ff" />
    <rect x="80" y="20" width="3" height="3" fill="#58a6ff" />
    <rect x="100" y="20" width="3" height="3" fill="#58a6ff" />
    <rect x="120" y="20" width="3" height="3" fill="#58a6ff" />
    <rect x="140" y="20" width="3" height="3" fill="#58a6ff" />
    <rect x="0" y="40" width="3" height="3" fill="#58a6ff" />
    <rect x="20" y="40" width="3" height="3" fill="#58a6ff" />
    <rect x="40" y="40" width="3" height="3" fill="#58a6ff" />
    <rect x="60" y="40" width="3" height="3" fill="#58a6ff" />
    <rect x="80" y="40" width="3" height="3" fill="#58a6ff" />
    <rect x="100" y="40" width="3" height="3" fill="#58a6ff" />
    <rect x="120" y="40" width="3" height="3" fill="#58a6ff" />
    <rect x="140" y="40" width="3" height="3" fill="#58a6ff" />
    <rect x="0" y="60" width="3" height="3" fill="#58a6ff" />
    <rect x="20" y="60" width="3" height="3" fill="#58a6ff" />
    <rect x="40" y="60" width="3" height="3" fill="#58a6ff" />
    <rect x="60" y="60" width="3" height="3" fill="#58a6ff" />
    <rect x="80" y="60" width="3" height="3" fill="#58a6ff" />
    <rect x="100" y="60" width="3" height="3" fill="#58a6ff" />
    <rect x="120" y="60" width="3" height="3" fill="#58a6ff" />
    <rect x="140" y="60" width="3" height="3" fill="#58a6ff" />
  </g>
</svg>
